# Ambiente Apache Airflow + PostgreSQL + dbt
# Uso:
#   docker compose build             # construye imagen Airflow con dbt (primera vez / al cambiar requirements)
#   docker compose up airflow-init   # inicializa DB y crea usuario admin (solo primera vez)
#   docker compose up -d             # levanta todo
#   docker compose down              # apaga (mantiene datos)
#   docker compose down -v           # apaga y BORRA datos de postgres
#
# UI Airflow: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
# Usuario/clave: definidos en .env (AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD)
#
# dbt (contenedor CLI de larga vida para desarrollo):
#   docker compose exec dbt dbt debug --project-dir /usr/app
#   docker compose exec dbt dbt build --project-dir /usr/app
# O desde Airflow: ver dags/dbt_build.py (BashOperator, dbt ya instalado en la imagen).

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME}
  # Sin `user:`: el contenedor arranca como root para que entrypoint-airflow.sh
  # ajuste el UID en runtime; el entrypoint oficial baja a `airflow` vía gosu.
  # AIRFLOW_UID vive solo en .env (default 50000 = imagen sin tocar).
  entrypoint: /opt/airflow/scripts/entrypoint-airflow.sh
  env_file:
    - .env
  environment:
    # Conexión a Postgres construida desde las variables del .env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION:-True}
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: ${AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS:-False}
    # Mapeo de usuario admin del .env al formato que espera airflow-init
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
    _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
    _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    # UID aplicado en runtime por entrypoint-airflow.sh (default = host típico).
    AIRFLOW_UID: ${AIRFLOW_UID:-1000}
    # Proyecto dbt (montado abajo en /opt/airflow/dbt, misma conexión del .env)
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_HOST: ${DBT_HOST:-postgres}
    DBT_PORT: ${DBT_PORT:-5432}
    DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
    DBT_THREADS: ${DBT_THREADS:-4}
    POSTGRES_WAREHOUSE_DB: ${POSTGRES_WAREHOUSE_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - ./scripts:/opt/airflow/scripts:ro
    - ./sql:/opt/airflow/sql:ro
    - ./raw-data:/opt/airflow/raw-data:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: proy1-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Guatemala}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # Scripts de inicialización (solo se ejecutan con volumen NUEVO):
      # 01 crea la DB warehouse (${POSTGRES_WAREHOUSE_DB}) y 02 carga sgfood_oltp.sql
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ./raw-data:/seed-data:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: proy1-airflow-init
    # Corre como root a propósito (sobrescribe el wrapper): root sí tiene
    # username y estos comandos solo tocan la DB, no los volúmenes.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db check-migrations -t 0 --migration-wait-timeout 60 || airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname "$${_AIRFLOW_WWW_USER_FIRSTNAME}" \
          --lastname "$${_AIRFLOW_WWW_USER_LASTNAME}" \
          --role Admin \
          --email "$${_AIRFLOW_WWW_USER_EMAIL}" || echo "Usuario admin ya existe, se omite creación."
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: proy1-airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: proy1-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dbt:
    image: ${DBT_IMAGE_NAME}
    container_name: proy1-dbt
    # La imagen dbt corre como root por defecto y dejaría logs/target
    # con dueño root en el host; se usa el UID del host como en Airflow.
    user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-0}"
    env_file:
      - .env
    environment:
      DBT_HOST: ${DBT_HOST:-postgres}
      DBT_PORT: ${DBT_PORT:-5432}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
      DBT_THREADS: ${DBT_THREADS:-4}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_WAREHOUSE_DB: ${POSTGRES_WAREHOUSE_DB}
      TZ: ${TZ:-America/Guatemala}
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
      - ./raw-data:/seed-data:ro
    # NOTA: la imagen dbt trae entrypoint `dbt`; hay que reemplazarlo,
    # si no ejecutaría `dbt sleep infinity` (comando inexistente).
    entrypoint: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-db-volume:
